[package]
name = "w2r-unit-color"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Custom colors for all eight teams on your screen, with color pickers and shareable color profiles"

[lib]
name = "w2r_unit_color"
crate-type = ["cdylib", "rlib"]

[dependencies]
w2r-abi.workspace = true
w2r-formats.workspace = true

[lints.clippy]
# Detours are called by the game; the ABI header documents the contract.
missing_safety_doc = "allow"
