[package]
name = "w2r-chat"
version = "1.2.1"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "In-match chat history with channels and player colours (port of wc2r-plus chat.cpp)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
w2r-abi.workspace = true

[target.'cfg(windows)'.dependencies]
# GetLocalTime for timestamps and the log file name.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation"] }

[lints.clippy]
# Exports and detours are called by the host and the game; the ABI header documents the contract.
missing_safety_doc = "allow"
